name: zap-passive-scan

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  API_TOKEN: ci-token

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: docker compose up -d --wait db

      - name: Run API on host
        run: |
          go build -o api .
          ./api &
          curl --retry 10 --retry-connrefused --retry-delay 1 -sf localhost:8080/health

      - name: ZAP spider + passive scan (docker)
        run: |
          # レポート出力先。事前に作って書込可にしないと docker が root 所有で作り、コンテナ内の zap ユーザーが書けない
          mkdir -p zap && chmod a+w zap
          rc=0; docker compose run --rm zap || rc=$?
          echo "zap-baseline exit=$rc (0=pass 1=fail 2=warn 3+=error)"
          [ "$rc" -le 2 ] && test -s zap/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/report.json

      - name: Register Medium+ findings as issues (1 alert = 1 issue, skip if exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # 既存の open issue タイトルを 1 回だけ取得し、[ZAP <alertRef>] の完全一致で判定する
          existing=$(gh issue list --state open --limit 500 --search "ZAP in:title" --json title -q '.[].title')
          jq -cf zap-issue.jq zap/report.json | while read -r alert; do
            key=$(jq -r .key <<<"$alert")
            title=$(jq -r .title <<<"$alert")
            if grep -qF "$key" <<<"$existing"; then
              echo "skip (exists): $title"
              continue
            fi
            { jq -r .body <<<"$alert"; printf -- '---\nrun: %s\n' "$run_url"; } \
              | gh issue create --title "$title" --body-file -
            echo "created: $title"
          done
